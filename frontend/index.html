    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" data-default content="website" />
    <meta property="og:site_name" data-default content="TradeSim" />
    <meta property="og:title" data-default content="TradeSim – Real-Time Crypto Trade Simulator" />

        "author": { "@type": "Person", "name": "Shubhankar Kaushik", "url": "https://github.com/Punosie" }
